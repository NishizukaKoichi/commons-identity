[advisories]
# Tauri currently includes transitive crates marked unmaintained by RustSec.
# CI checks both supported macOS target graphs and keeps vulnerabilities and
# unsound advisories blocking. Any unmaintained crate owned by this workspace
# is also an error; revisit this scope before supporting another desktop target.
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
