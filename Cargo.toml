[workspace]
members = [
  "crates/commons-identity-core",
  "crates/commons-identity-service",
  "crates/commons-identity-cli",
  "apps/wallet/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0-preview.1"
edition = "2024"
rust-version = "1.88"
authors = ["Commons Identity contributors"]
license = "Apache-2.0"
repository = "https://github.com/NishizukaKoichi/commons-identity"
homepage = "https://nishizukakoichi.github.io/commons-identity/"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
ciborium = "0.2.2"
clap = { version = "4.5.51", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
flate2 = "1.1.5"
hex = "0.4.3"
hmac = "0.12.1"
hkdf = "0.13.0"
http = "1.3.1"
http-body-util = "0.1.3"
multibase = "0.9.2"
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.1.0"
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "limit", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
