name: Bug report
description: 再現可能な不具合を、合成データだけで報告する
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Commons IdentityはDeveloper Previewで未監査です。秘密鍵、Recovery Kit、実在人物のCredential／個人情報、private endpointを投稿しないでください。脆弱性は公開IssueではなくPrivate Vulnerability Reportingへ送ってください。

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: この報告には秘密・個人情報・実在人物のデータ・未公開の脆弱性詳細を含めていません。
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Rust Core
        - HTTP service
        - CLI / local demo
        - Commons Wallet
        - Recovery / Archive
        - Status / revocation
        - Operator migration / audit
        - Documentation / build automation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tagまたは完全なcommit SHAを記載してください。
      placeholder: v0.1.0-preview.1 or 0123456789abcdef...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: 合成データを使った最小手順、実行コマンド、入力を記載してください。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: エラー全文は秘密とローカル絶対パスを除去して貼り付けてください。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/architecture、Rust、Node、pnpm、ブラウザ、再現頻度。
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Security and privacy impact
      description: 誤認可、相関、過剰開示、lockout、replay、stale statusへの影響。該当なしなら理由。
    validations:
      required: true
